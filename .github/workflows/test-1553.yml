name: Test issue 1553
on: [push, workflow_dispatch]
jobs:
  test-fix:
    runs-on: 	windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Setup Node.js
        uses: v-jitenderpalsingh/setup-node@test-1553
        with:
          node-version: "^24"
          node-version-file: "package.json"
      
      - name: Check version
        run: |
          node --version
          npm --version

  test:
    runs-on: 	windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: "^24"
          node-version-file: "package.json"

      - name: Check version
        run: |
          node --version
          npm --version
