name: Test issue 1553
on: [workflow_dispatch]
jobs:
  test-fix:
    runs-on: 	ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: check npm version
        run: npm --version

      - uses: actions/setup-node@main
        with:
          node-version-file: "package.json"
      
      - name: Check version
        run: |
          node --version
          npm --version