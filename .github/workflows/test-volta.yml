name: test-volta
on: [push, workflow_dispatch]
jobs:
  test-fix:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@main

      - name: create a symlink
        run: |
          ln -s "$HOME/dummy-path/test.txt" "$GITHUB_WORKSPACE/linked.txt"

          # Show where the symlink actually points, without printing file contents.
          readlink -f "$GITHUB_WORKSPACE/linked.txt"


      - name: Setup Node
        uses: v-gowridurgad/setup-node@fix-voltas
        with:
          node-version-file: "test.json"