name: test-volta
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@main

      - name: create a file in dummy path outside workspace
        run: |
          mkdir -p ${HOME}/dummy-path
          echo 'Hello World!!!!' > "$HOME/dummy-path/test.txt"

      - name: create a symlink
        run: |
          ln -s "$HOME/dummy-path/test.txt" "$GITHUB_WORKSPACE/volta-symlink-test/linked.txt"

          # Show where the symlink actually points, without printing file contents.
          readlink -f "$GITHUB_WORKSPACE/volta-symlink-test/linked.txt"

      - name: Setup Node
        uses: v-gowridurgad/setup-node@volts-fix
        with:
          node-version-file: "a.json"
      
      