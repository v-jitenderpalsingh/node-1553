name: test-volta
on: [push, workflow_dispatch]
jobs:
  test-fix:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@main

      - name: create a file in dummy path outside workspace
        run: |
          mkdir -p ${HOME}/dummy-path
          echo 'Hello World!!!!' > "$HOME/dummy-path/test.txt"

      - name: Setup Node
        uses: v-gowridurgad/setup-node@fix-voltas
        with:
          node-version-file: "test.json"