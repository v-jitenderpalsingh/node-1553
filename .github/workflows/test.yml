name: Test
on: [push, workflow_dispatch]
jobs:
  test-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: v-jitenderpalsingh/setup-node@test-1553
        with:
          node-version-file: "package.json"
      
      - name: Check version
        run: |
          node --version
          npm --version

  
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@main
        with:
          node-version-file: "package.json"
      
      - name: Check version
        run: |
          node --version
          npm --version